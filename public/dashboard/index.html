<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>OmniBot Dashboard</title>
<style>
:root{--bg:#0b0d12;--sidebar:#0e1118;--panel:#141824;--panel2:#1a1f2e;--border:#252b3b;--text:#eef0f6;--muted:#8b93a7;--accent:#5b6cff;--ok:#3dd68c;--radius:14px}
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Inter,ui-sans-serif,system-ui,sans-serif;background:var(--bg);color:var(--text)}a{color:var(--accent);text-decoration:none}button,input,select,textarea{font:inherit}
.landing{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
.landing h1{font-size:2.4rem;margin:0 0 8px}.landing p{color:var(--muted);max-width:420px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:12px 20px;cursor:pointer;font-weight:600}
.btn-primary{background:var(--accent);color:#fff}.btn-secondary{background:var(--panel2);color:var(--text);border:1px solid var(--border)}
.app{display:none;grid-template-columns:260px 1fr;min-height:100%}
.sidebar{background:var(--sidebar);border-right:1px solid var(--border);padding:20px 14px;display:flex;flex-direction:column}
.side-brand{font-weight:800;font-size:1.2rem;margin-bottom:18px}.side-brand span{color:var(--accent)}
.side-nav{display:flex;flex-direction:column;gap:4px;flex:1}.side-nav button{text-align:left;background:transparent;border:0;color:var(--muted);padding:10px 12px;border-radius:10px;cursor:pointer}.side-nav button.active,.side-nav button:hover{background:var(--panel);color:var(--text)}
.side-user{margin-top:auto;padding-top:12px;border-top:1px solid var(--border);font-size:.9rem;color:var(--muted)}
.main{display:flex;flex-direction:column;min-width:0}.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--border)}.content{padding:20px;overflow:auto}
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:14px}
.field{display:flex;flex-direction:column;gap:6px;margin:12px 0;font-size:.92rem}.field input,.field select,.field textarea{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:10px 12px;color:var(--text)}
.field textarea{min-height:80px;resize:vertical}.desc{color:var(--muted);font-size:.85rem}
.switch{width:46px;height:26px;border-radius:999px;background:#2a3144;position:relative;cursor:pointer;flex-shrink:0}.switch.on{background:var(--accent)}.switch::after{content:"";position:absolute;width:20px;height:20px;border-radius:50%;background:#fff;top:3px;left:3px;transition:.15s}.switch.on::after{left:23px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)}.row:last-child{border:0}
.server-card{cursor:pointer}.server-card:hover{border-color:var(--accent)}
.toast{position:fixed;bottom:20px;right:20px;background:var(--panel2);border:1px solid var(--border);padding:12px 16px;border-radius:12px;display:none;z-index:50}.toast.show{display:block}
.hidden{display:none!important}.status{display:inline-flex;align-items:center;gap:8px;font-size:.85rem;color:var(--muted)}.status i{width:8px;height:8px;border-radius:50%;background:#666;display:inline-block}.status.ok i{background:var(--ok)}
</style></head><body>
<div id="landing" class="landing">
  <h1>Omni<span style="color:var(--accent)">Bot</span></h1>
  <p>AI, moderation, music, economy and more — configured live.</p>
  <p style="margin:24px 0"><a class="btn btn-primary" href="/auth/login">Add to Discord / Log in</a></p>
  <p class="desc">Admin-only settings. Manage every feature from one place.</p>
</div>
<div id="app" class="app">
  <aside class="sidebar" id="sidebar">
    <div class="side-brand">Omni<span>Bot</span></div>
    <nav class="side-nav" id="side-nav">
      <button data-view="servers" class="active">Servers</button>
      <button data-view="overview" class="needs-guild hidden">Overview</button>
      <button data-view="ai" class="needs-guild hidden">AI & Personality</button>
      <button data-view="moderation" class="needs-guild hidden">Moderation</button>
      <button data-view="engagement" class="needs-guild hidden">Engagement</button>
      <button data-view="roles" class="needs-guild hidden">Roles</button>
      <button data-view="music" class="needs-guild hidden">Music</button>
      <button data-view="logging" class="needs-guild hidden">Logging</button>
      <button data-view="tickets" class="needs-guild hidden">Tickets</button>
    </nav>
    <div class="side-user" id="side-user"></div>
    <button class="btn btn-secondary" id="btn-logout" style="margin-top:10px">Log out</button>
  </aside>
  <div class="main">
    <div class="topbar">
      <span id="top-title">Servers</span>
      <span class="status" id="bot-status"><i></i> Checking…</span>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
const S={user:null,guilds:[],guildId:null,guildName:'',settings:{},channels:[],roles:[],view:'servers'};
const SECTIONS={
  ai:[{id:'ai.enabled',label:'AI enabled',type:'bool'},{id:'ai.naturalInvocation',label:'Natural invocation (say Omni)',type:'bool'},{id:'ai.memoryEnabled',label:'Per-user memory',type:'bool'},{id:'ai.commandPrefix',label:'Command prefix',type:'text'},{id:'ai.personality',label:'Personality / system prompt',type:'textarea'}],
  moderation:[{id:'moderation.automodEnabled',label:'Word filter automod',type:'bool'},{id:'moderation.blockedWords',label:'Blocked words (comma-separated)',type:'textarea'},{id:'moderation.antiSpamEnabled',label:'Anti-spam',type:'bool'},{id:'moderation.smartAutomodEnabled',label:'Smart automod (no AI key)',type:'bool',hint:'Local rules: invites, scams, mass mentions, caps — does NOT use Groq'},{id:'moderation.smartAutomodAction',label:'Smart automod action',type:'select',options:['delete','timeout']},{id:'moderation.timeoutMinutes',label:'Timeout minutes',type:'number'},{id:'moderation.blockInvites',label:'Block Discord invites',type:'bool'},{id:'moderation.blockLinks',label:'Block all links',type:'bool'},{id:'moderation.maxMentions',label:'Max mentions per message',type:'number'},{id:'security.enabled',label:'Anti-nuke monitoring',type:'bool'},{id:'honeypot.enabled',label:'Honeypot protection',type:'bool'},{id:'honeypot.channelId',label:'Honeypot channel',type:'channel'}],
  engagement:[{id:'welcome.enabled',label:'Welcome messages',type:'bool'},{id:'welcome.channelId',label:'Welcome channel',type:'channel'},{id:'welcome.message',label:'Welcome text',type:'textarea'},{id:'goodbye.enabled',label:'Goodbye messages',type:'bool'},{id:'goodbye.channelId',label:'Goodbye channel',type:'channel'},{id:'goodbye.message',label:'Goodbye text',type:'textarea'},{id:'deadchat.enabled',label:'Dead Chat Reviver',type:'bool'},{id:'deadchat.minutes',label:'Minutes of silence',type:'number'},{id:'deadchat.channelId',label:'Dead chat channel',type:'channel'},{id:'leveling.enabled',label:'Leveling / XP',type:'bool'},{id:'leveling.announce',label:'Announce level-ups',type:'bool'},{id:'autorole.enabled',label:'Autorole',type:'bool'},{id:'autorole.roleId',label:'Autorole role',type:'role'},{id:'starboard.enabled',label:'Starboard',type:'bool'},{id:'starboard.channelId',label:'Starboard channel',type:'channel'},{id:'counting.enabled',label:'Counting',type:'bool'},{id:'counting.channelId',label:'Counting channel',type:'channel'},{id:'verification.enabled',label:'Verification',type:'bool'},{id:'verification.channelId',label:'Verify panel channel',type:'channel'},{id:'verification.roleId',label:'Verified role',type:'role'},{id:'booster.enabled',label:'Booster messages',type:'bool'},{id:'booster.channelId',label:'Booster channel',type:'channel'},{id:'bump.enabled',label:'Bump reminder',type:'bool'},{id:'bump.channelId',label:'Bump channel',type:'channel'},{id:'bump.message',label:'Bump message',type:'text'},{id:'social.enabled',label:'Social notifications',type:'bool'},{id:'social.channelId',label:'Social channel',type:'channel'}],
  music:[{id:'music.enabled',label:'Music (SoundCloud)',type:'bool'}],
  logging:[{id:'logging.enabled',label:'Logging',type:'bool'},{id:'logging.channelId',label:'Log channel',type:'channel'}],
  tickets:[{id:'tickets.enabled',label:'Tickets',type:'bool'},{id:'tickets.staffRoleId',label:'Staff role',type:'role'},{id:'tickets.panelChannelId',label:'Panel channel',type:'channel'},{id:'tickets.categoryId',label:'Ticket category',type:'channel'}]
};
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3200)}
async function api(path,opts={}){const r=await fetch('/api'+path,{credentials:'include',...opts,headers:{'Content-Type':'application/json',...(opts.headers||{})}});if(!r.ok){const e=await r.json().catch(()=>({}));throw new Error(e.detail||e.message||r.statusText)}return r.json()}
function showLanding(on){document.getElementById('landing').style.display=on?'flex':'none';document.getElementById('app').style.display=on?'none':'grid';if(!on)document.getElementById('app').classList.add('on')}
async function refreshAuth(){try{const m=await api('/auth/me');S.user=m.user;document.getElementById('side-user').textContent=m.user?.global_name||m.user?.username||'';return true}catch{return false}}
async function loadGuilds(){const r=await api('/guilds');S.guilds=r.guilds||[]}
function setView(v){S.view=v;document.querySelectorAll('.side-nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===v));document.getElementById('top-title').textContent=v.charAt(0).toUpperCase()+v.slice(1);render()}
function channelOptions(sel){return '<option value="">— none —</option>'+(S.channels||[]).map(c=>`<option value="${c.id}" ${String(sel)===String(c.id)?'selected':''}>#${c.name}</option>`).join('')}
function roleOptions(sel){return '<option value="">— none —</option>'+(S.roles||[]).map(r=>`<option value="${r.id}" ${String(sel)===String(r.id)?'selected':''}>@${r.name}</option>`).join('')}
async function openGuild(id,name){S.guildId=id;S.guildName=name||id;try{const b=await api(`/guilds/${id}/bundle`);S.settings=b.settings||{};S.channels=b.channels||[];S.roles=b.roles||[];document.querySelectorAll('.needs-guild').forEach(el=>el.classList.remove('hidden'));setView('overview')}catch(e){toast(e.message)}}
function renderServers(){if(!S.guilds.length)return `<div class="card"><p class="desc">No servers where you have Administrator.</p></div>`;return S.guilds.map(g=>`<div class="card server-card" data-id="${g.id}" data-name="${g.name||''}"><strong>${g.name||g.id}</strong><p class="desc">${g.botIn?'Bot is in this server':'Invite the bot'}</p></div>`).join('')}
function renderOverview(){return `<div class="card"><h3>${S.guildName}</h3><p class="desc">Pick a section on the left.</p></div>`}
function renderSettings(fields){
  if(!fields)return renderOverview();
  const rows=fields.map(f=>{const val=S.settings[f.id];
    if(f.type==='bool')return `<div class="row"><div><div>${f.label}</div>${f.hint?`<div class="desc">${f.hint}</div>`:''}</div><div class="switch ${val?'on':''}" data-id="${f.id}"></div></div>`;
    if(f.type==='channel')return `<label class="field">${f.label}<select data-id="${f.id}">${channelOptions(val)}</select></label>`;
    if(f.type==='role')return `<label class="field">${f.label}<select data-id="${f.id}">${roleOptions(val)}</select></label>`;
    if(f.type==='select')return `<label class="field">${f.label}<select data-id="${f.id}">${(f.options||[]).map(o=>`<option ${val===o?'selected':''}>${o}</option>`).join('')}</select></label>`;
    if(f.type==='textarea')return `<label class="field">${f.label}<textarea data-id="${f.id}">${val??''}</textarea></label>`;
    return `<label class="field">${f.label}<input data-id="${f.id}" type="${f.type==='number'?'number':'text'}" value="${val??''}"></label>`;
  }).join('');
  let extra=S.view==='tickets'?`<button class="btn btn-secondary" id="btn-ticket-panel" style="margin-top:12px;margin-left:8px">Post ticket panel</button>`:'';
  let social='';
  if(S.view==='engagement'){
    social=`<div class="card" id="social-feeds-card"><h3>Social notification feeds</h3>
      <p class="desc">Add platform + handle. Staff post alerts with /social notify. Enable social + pick channel above, then Save.</p>
      <div class="row" style="flex-wrap:wrap;gap:8px;align-items:flex-end">
        <label class="field" style="flex:1;min-width:120px;margin:0">Platform
          <select id="sf-platform"><option value="youtube">YouTube</option><option value="twitch">Twitch</option><option value="twitter">Twitter / X</option><option value="tiktok">TikTok</option><option value="instagram">Instagram</option><option value="reddit">Reddit</option></select>
        </label>
        <label class="field" style="flex:2;min-width:140px;margin:0">Handle<input id="sf-handle" placeholder="e.g. MrBeast"/></label>
        <button class="btn btn-primary" id="btn-sf-add">Add feed</button>
      </div>
      <div id="sf-list" class="desc" style="margin-top:14px">Loading…</div>
    </div>`;
  }
  return `<div class="card"><h3>${S.guildName}</h3><p class="desc">${(S.channels||[]).length} channels · ${(S.roles||[]).length} roles</p>${rows}<button class="btn btn-primary" id="btn-save" style="margin-top:18px">Save changes</button>${extra}</div>${social}`;
}
function renderRolesPanel(){
  const chOpts=channelOptions(''),roleOpts=roleOptions('');
  let rows='';
  for(let i=1;i<=5;i++)rows+=`<div class="row" style="flex-wrap:wrap;gap:8px"><label class="field" style="flex:1;min-width:100px">Emoji ${i}<input data-rr-emoji="${i}" placeholder="🎮"></label><label class="field" style="flex:2;min-width:140px">Role ${i}<select data-rr-role="${i}">${roleOpts}</select></label></div>`;
  return `<div class="card"><h3>Reaction roles</h3><p class="desc">Post a panel. Members react to get/remove roles.</p>
    <label class="field">Channel<select id="rr-channel">${chOpts}</select></label>
    <label class="field">Title<input id="rr-title" value="Choose your roles"></label>
    <label class="field">Description<textarea id="rr-desc">React below to get a role</textarea></label>
    ${rows}
    <button class="btn btn-primary" id="btn-rr-post" style="margin-top:14px">Post reaction panel</button>
    <button class="btn btn-secondary" id="btn-rr-list" style="margin-top:14px;margin-left:8px">List bindings</button>
    <div id="rr-list" class="desc" style="margin-top:12px"></div></div>`;
}
async function render(){const c=document.getElementById('content');if(S.view==='servers')c.innerHTML=renderServers();else if(S.view==='overview')c.innerHTML=renderOverview();else if(S.view==='roles')c.innerHTML=renderRolesPanel();else c.innerHTML=renderSettings(SECTIONS[S.view]);bind()}
function bind(){
  document.querySelectorAll('.server-card[data-id]').forEach(el=>{el.onclick=()=>openGuild(el.dataset.id,el.dataset.name)});
  document.querySelectorAll('.switch[data-id]').forEach(el=>{el.onclick=()=>el.classList.toggle('on')});
  const save=document.getElementById('btn-save');
  if(save)save.onclick=async()=>{const patch={};document.querySelectorAll('[data-id]').forEach(el=>{const id=el.dataset.id;if(el.classList.contains('switch'))patch[id]=el.classList.contains('on');else if(el.tagName==='SELECT')patch[id]=el.value;else if(el.type==='number')patch[id]=Number(el.value);else patch[id]=el.value});try{await api(`/guilds/${S.guildId}/settings`,{method:'PUT',body:JSON.stringify({patch})});Object.assign(S.settings,patch);toast('Saved')}catch(e){toast(e.message)}};
  const panelBtn=document.getElementById('btn-ticket-panel');
  if(panelBtn)panelBtn.onclick=async()=>{const ch=(document.querySelector('[data-id="tickets.panelChannelId"]')||{}).value||S.settings['tickets.panelChannelId'];if(!ch){toast('Pick a panel channel first');return}try{await api(`/guilds/${S.guildId}/tickets/panel`,{method:'POST',body:JSON.stringify({channel_id:String(ch)})});toast('Ticket panel posted')}catch(e){toast(e.message)}};
  const rrPost=document.getElementById('btn-rr-post');
  if(rrPost)rrPost.onclick=async()=>{const ch=document.getElementById('rr-channel')?.value;if(!ch){toast('Pick a channel');return}const pairs=[];for(let i=1;i<=5;i++){const em=document.querySelector(`[data-rr-emoji="${i}"]`)?.value?.trim();const rid=document.querySelector(`[data-rr-role="${i}"]`)?.value;if(em&&rid)pairs.push({emoji:em,role_id:String(rid)})}if(!pairs.length){toast('Add at least one emoji + role');return}try{await api(`/guilds/${S.guildId}/roles/reaction-panel`,{method:'POST',body:JSON.stringify({channel_id:String(ch),title:document.getElementById('rr-title')?.value||'Roles',description:document.getElementById('rr-desc')?.value||'',pairs})});toast('Reaction panel posted')}catch(e){toast(e.message)}};
  const rrList=document.getElementById('btn-rr-list');
  if(rrList)rrList.onclick=async()=>{try{const r=await api(`/guilds/${S.guildId}/roles/reaction-list`);const items=r.items||[];const el=document.getElementById('rr-list');if(!items.length){el.textContent='No bindings yet.';return}el.innerHTML=items.map(i=>`• ${i.emoji} → role ${i.roleId} · msg ${i.messageId}`).join('<br>')}catch(e){toast(e.message)}};
  async function loadSocialFeeds(){const el=document.getElementById('sf-list');if(!el||!S.guildId)return;try{const r=await api(`/guilds/${S.guildId}/social/feeds`);const feeds=r.feeds||[];if(!feeds.length){el.innerHTML='<span class="desc">No feeds yet.</span>';return}el.innerHTML=feeds.map((f,i)=>`<div class="row" style="padding:8px 0"><div><strong>${(f.platform||'').toUpperCase()}</strong> · <code>${f.handle||''}</code></div><button class="btn btn-secondary btn-sf-remove" data-idx="${i}" style="padding:6px 12px;font-size:.85rem">Remove</button></div>`).join('');el.querySelectorAll('.btn-sf-remove').forEach(btn=>{btn.onclick=async()=>{try{await api(`/guilds/${S.guildId}/social/feeds/${btn.dataset.idx}`,{method:'DELETE'});toast('Feed removed');loadSocialFeeds()}catch(e){toast(e.message)}}})}catch(e){el.textContent='Could not load feeds: '+e.message}}
  const sfAdd=document.getElementById('btn-sf-add');
  if(sfAdd)sfAdd.onclick=async()=>{const platform=document.getElementById('sf-platform')?.value||'youtube';const handle=(document.getElementById('sf-handle')?.value||'').trim();if(!handle){toast('Enter a handle');return}try{await api(`/guilds/${S.guildId}/social/feeds`,{method:'POST',body:JSON.stringify({platform,handle})});document.getElementById('sf-handle').value='';toast('Feed added');loadSocialFeeds()}catch(e){toast(e.message)}};
  if(S.view==='engagement')loadSocialFeeds();
}
document.getElementById('side-nav').onclick=e=>{const b=e.target.closest('button[data-view]');if(b)setView(b.dataset.view)};
document.getElementById('btn-logout').onclick=async()=>{try{await api('/auth/logout',{method:'POST'})}catch{}location.href='/'};
(async()=>{try{const v=await api('/version');const st=document.getElementById('bot-status');if(v.discordReady){st.classList.add('ok');st.innerHTML='<i></i> Bot online'}else st.innerHTML='<i></i> Bot offline'}catch{document.getElementById('bot-status').innerHTML='<i></i> API unreachable'}if(await refreshAuth()){showLanding(false);try{await loadGuilds()}catch(e){toast(e.message)}setView('servers')}else showLanding(true)})();
</script></body></html>
